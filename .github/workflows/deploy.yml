# Pipeline CI/CD — Compétence CCP2 : "Automatiser la mise en production
# d'une application avec une plateforme"
#
# 1) build de l'image Docker
# 2) tests automatisés (pytest) contre docker-compose.test.yml
# 3) publication de l'image sur GitHub Container Registry (GHCR)
# 4) déploiement continu sur le cluster k3s (rolling update) via kubectl,
#    en utilisant le kubeconfig récupéré par ansible/bootstrap_k3s.yml
name: CI/CD - TechCorp Order Tracker

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/techcorp-order-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire et lancer l'environnement de test
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Attendre que l'API réponde
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:8001/health && break
            sleep 3
          done

      - name: Installer les dépendances de test
        run: pip install pytest requests

      - name: Exécuter la suite de tests
        run: pytest tests/ -v

      - name: Nettoyer l'environnement de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer kubectl avec le kubeconfig du cluster k3s
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Appliquer les manifests Kubernetes
        run: kubectl apply -f k8s/ --namespace techcorp-orders

      - name: Rolling update avec la nouvelle image
        run: |
          kubectl set image deployment/order-tracker \
            order-tracker=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n techcorp-orders
          kubectl rollout status deployment/order-tracker -n techcorp-orders
